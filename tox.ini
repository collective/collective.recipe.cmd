[tox]
envlist =
    py310-plone61,py313-plone61
    py310-plone62,py314-plone62


[testenv:py{310,311,312,313,314}-plone61]
usedevelop = true
deps =
    -r https://dist.plone.org/release/6.1-latest/requirements.txt
    zope.testing
    zope.testrunner
    manuel
commands =
    zope-testrunner --path=. --test-path=. --auto-color --auto-progress

[testenv:py{310,311,312,313,314}-plone62]
usedevelop = true
deps =
    -r https://dist.plone.org/release/6.2-latest/requirements.txt
    zope.testing
    zope.testrunner
    manuel
commands =
    zope-testrunner --path=. --test-path=. --auto-color --auto-progress